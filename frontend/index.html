<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard JourneyFlow para acompanhar a integração e o desenvolvimento da equipe.">
    <meta name="theme-color" content="#f47b68">
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <title>JourneyFlow | Dashboard</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("journeyflow.settings") || "{}");
        if (saved && saved.theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (error) { /* tema padrão */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#" data-skip-to-content>Pular para o conteúdo</a>
    <div id="progress" class="progress" aria-hidden="true"></div>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <span class="boot__spinner" aria-hidden="true"></span>
      <span class="visually-hidden">Carregando o JourneyFlow…</span>
    </div>
    <noscript>O JourneyFlow precisa de JavaScript para funcionar.</noscript>
    <section id="login-screen" class="login-screen" aria-labelledby="login-title" hidden>
      <form class="login-card" data-login-form>
        <img src="assets/icons/logo.svg" alt="" class="login-card__logo">
        <h1 id="login-title">Entrar no JourneyFlow</h1>
        <p>Entre com sua conta de gestor ou colaborador. A conta do colaborador é criada pelo gestor no cadastro de funcionários.</p>
        <label>E-mail
          <input name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>Senha
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="login-card__error" data-login-error role="alert" hidden></p>
        <button class="button button--primary" type="submit">Entrar</button>
      </form>
    </section>
    <div class="app-layout" hidden>
      <aside id="sidebar" class="sidebar-host" aria-label="Navegação principal"></aside>
      <div class="workspace">
        <header id="header" class="header-host"></header>
        <main id="main-content" class="main-content" tabindex="-1">
        </main>
      </div>
    </div>
  </body>
</html>
