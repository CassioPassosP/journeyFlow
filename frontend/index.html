<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard JourneyFlow para acompanhar a integração e o desenvolvimento da equipe.">
    <title>JourneyFlow | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <aside id="sidebar" class="sidebar-host" aria-label="Navegação principal"></aside>
      <div class="workspace">
        <header id="header" class="header-host"></header>
        <main id="main-content" class="main-content">
          <section id="greeting" class="greeting" aria-labelledby="greeting-title"></section>
          <div class="dashboard-grid">
            <section id="summary-cards" class="summary-cards" aria-label="Resumo da equipe"></section>
            <section id="status-chart" class="dashboard-panel status-chart" aria-label="Status mensal da equipe"></section>
            <section id="updates-chart" class="dashboard-panel updates-chart" aria-label="Colaboradores com mais atualizações"></section>
            <section id="recent-alerts" class="dashboard-panel recent-alerts" aria-label="Alertas recentes"></section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
