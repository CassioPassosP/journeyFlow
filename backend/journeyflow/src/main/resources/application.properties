spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
spring.application.name=journeyflow

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

security.jwt.secret=${SECURITY_JWT_SECRET}

security.jwt.expiration-ms=86400000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evita lazy-loading "escondido" durante a serializacao JSON (fonte classica de N+1).
# Todo mapeamento entidade -> DTO acontece dentro do @Transactional dos Services.
spring.jpa.open-in-view=false

# Paginacao: tamanho padrao e teto (o cliente nao consegue pedir ?size=100000)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

gemini.api-key=${GEMINI_API_KEY:}

gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

