spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
spring.application.name=journeyflow

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=
spring.datasource.password=

security.jwt.secret=
security.jwt.expiration-ms=86400000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evita lazy-loading "escondido" durante a serializacao JSON (fonte classica de N+1).
# Todo mapeamento entidade -> DTO acontece dentro do @Transactional dos Services.
spring.jpa.open-in-view=false